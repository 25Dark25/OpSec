plugins {
    id "fabric-loom" version "1.17.11"
    id "maven-publish"
}

def javaVersion = property("java_version") as int

group = property("maven_group")
version = property("mod_version")

base {
    archivesName = "opsec-${property('minecraft_version')}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        create("opsec") {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "opsec.refmap.json"
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/"; name = "Terraformers" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/"; name = "Sponge" }
    maven { url = "https://maven.bawnorton.com/releases"; name = "Bawnorton" }
}

dependencies {
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"
    modImplementation("com.terraformersmc:modmenu:${property('modmenu_version')}") {
        exclude group: "eu.pb4", module: "placeholder-api"
    }

    // TODO(P1): evaluar si Meteor Fix justifica una dependencia beta empaquetada.
    include implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1"))
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", project.version
    inputs.property "minecraft_version_range", property("minecraft_version_range")
    inputs.property "java_version", property("java_version")

    filesMatching("fabric.mod.json") {
        expand(
            version: project.version,
            minecraft_version_range: property("minecraft_version_range"),
            java_version: property("java_version")
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

tasks.named("jar") {
    from("LICENSE") { rename { "${it}_opsec" } }
}

tasks.named("remapJar") {
    archiveFileName = "opsec-${property('minecraft_version')}+v${project.version}.jar"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "opsec"
            from components.java
        }
    }
}